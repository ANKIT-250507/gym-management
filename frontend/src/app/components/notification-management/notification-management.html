<div class="notification-container">

    <div class="header">

        <div>

            <h2>Notification Management</h2>

            <p>Create and Manage Notifications</p>

        </div>

        <button class="add-btn" (click)="showModal=true">

            <i class="bi bi-plus-circle-fill"></i>

            Add Notification

        </button>

    </div>

    <div class="table-box">

        <table>

            <thead>

                <tr>

                    <th>Title</th>

                    <th>Message</th>

                    <th>Type</th>

                    <th>Created By</th>

                    <th>Date</th>

                    <th>Action</th>

                </tr>

            </thead>

            <tbody>

                <tr *ngFor="let item of notifications">

                    <td>{{item.title}}</td>

                    <td>{{item.message}}</td>

                    <td>{{item.type}}</td>

                    <td>{{item.createdBy?.name}}</td>

                    <td>{{item.createdAt | date:'short'}}</td>

                    <td>

                        <button
                            class="delete"
                            (click)="deleteNotification(item._id)">

                            <i class="bi bi-trash-fill"></i>

                        </button>

                    </td>

                </tr>

            </tbody>

        </table>

    </div>

</div>

<!-- Modal -->

<div class="modal" *ngIf="showModal">

    <div class="modal-content">

        <h3>Create Notification</h3>

        <input
            type="text"
            placeholder="Title"
            [(ngModel)]="newNotification.title">

        <textarea
            rows="4"
            placeholder="Message"
            [(ngModel)]="newNotification.message">
        </textarea>

        <select [(ngModel)]="newNotification.type">

            <option value="General">General</option>

            <option value="Holiday">Holiday</option>

            <option value="Membership">Membership</option>

        </select>

        <div class="modal-buttons">

            <button
                class="cancel-btn"
                (click)="showModal=false">

                Cancel

            </button>

            <button
                class="save-btn"
                (click)="addNotification()">

                Save

            </button>

        </div>

    </div>

</div>
