<div class="quick-actions">

    <div class="section-title">
        <div>
            <h3>Quick Actions</h3>
            <p>Manage your gym quickly</p>
        </div>
    </div>

    <div class="action-grid">

        <div class="action-card members" routerLink="/members">
            <div class="action-icon">
                <i class="bi bi-person-plus-fill"></i>
            </div>
            <div>
                <h4>Add Member</h4>
                <p>Register a new member</p>
            </div>
            <i class="bi bi-arrow-right arrow"></i>
        </div>

        <div class="action-card workout" routerLink="/workout">
            <div class="action-icon">
                <i class="bi bi-heart-pulse-fill"></i>
            </div>
            <div>
                <h4>Add Workout</h4>
                <p>Assign workout plan</p>
            </div>
            <i class="bi bi-arrow-right arrow"></i>
        </div>

        <div class="action-card diet" routerLink="/diet">
            <div class="action-icon">
                <i class="bi bi-egg-fried"></i>
            </div>
            <div>
                <h4>Add Diet Plan</h4>
                <p>Create nutrition plan</p>
            </div>
            <i class="bi bi-arrow-right arrow"></i>
        </div>

        <div class="action-card membership" routerLink="/membership">
            <div class="action-icon">
                <i class="bi bi-credit-card-fill"></i>
            </div>
            <div>
                <h4>Add Membership</h4>
                <p>Create membership</p>
            </div>
            <i class="bi bi-arrow-right arrow"></i>
        </div>

        <div class="action-card notification" routerLink="/notifications">
            <div class="action-icon">
                <i class="bi bi-bell-fill"></i>
            </div>
            <div>
                <h4>Notification</h4>
                <p>Send gym announcement</p>
            </div>
            <i class="bi bi-arrow-right arrow"></i>
        </div>

    </div>

</div>
