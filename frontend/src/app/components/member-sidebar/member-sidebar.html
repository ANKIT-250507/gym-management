<aside class="sidebar">

  <div class="logo">
    <div class="logo-icon">G</div>

    <div>
      <h2>GYM</h2>
      <span>MEMBER</span>
    </div>
  </div>


  <div class="menu-title">
    MAIN MENU
  </div>


  <nav>

    <a routerLink="/member-dashboard" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">

      <span class="icon">🏠</span>
      <span>Dashboard</span>

    </a>


    <a routerLink="/member-workout" routerLinkActive="active">

      <span class="icon">🏋️</span>
      <span>Workout</span>

    </a>


    <a routerLink="/member-diet" routerLinkActive="active">

      <span class="icon">🥗</span>
      <span>Diet Plan</span>

    </a>

    <a routerLink="/member-products" routerLinkActive="active">
      <i class="bi bi-bag-fill"></i>
      <span>Gym Products</span>
    </a>


    <a routerLink="/member-attendance">
      <i class="bi bi-calendar-check"></i>
      <span>My Attendance</span>
    </a>


    <a routerLink="/member-fitness">
      <i class="bi bi-heart-pulse"></i>
      <span>BMI & Fitness</span>
    </a>


    <a routerLink="/member-membership">
      <i class="bi bi-credit-card"></i>
      <span>My Membership</span>
    </a>


    <a routerLink="/member-notifications">
      <i class="bi bi-bell-fill"></i>
      <span>Notifications</span>
    </a>

  </nav>


  <div class="sidebar-bottom">

    <button (click)="logout()">

      <span class="icon">↪</span>

      <span>Logout</span>

    </button>

  </div>

</aside>
