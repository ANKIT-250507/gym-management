<div class="product-container">

    <div class="header">

        <div>

            <h2>Products Management</h2>

            <p>Manage Gym Products</p>

        </div>

        <button class="add-btn" (click)="showModal=true">

            <i class="bi bi-plus-circle"></i>

            Add Product

        </button>

    </div>

    <div class="table-box">

        <table>

            <thead>

                <tr>

                    <th>Name</th>
                    <th>Category</th>
                    <th>Price</th>
                    <th>Stock</th>
                    <th>Description</th>
                    <th>Actions</th>

                </tr>

            </thead>

            <tbody>

                <tr *ngFor="let product of products">

                    <td>{{product.name}}</td>

                    <td>{{product.category}}</td>

                    <td>₹{{product.price}}</td>

                    <td>

                        <span
                            [style.color]="product.stock<=5 ? 'red':'green'">

                            {{product.stock}}

                        </span>

                    </td>

                    <td>{{product.description}}</td>

                    <td>

                        <button
                            class="edit"
                            (click)="editProduct(product)">

                            <i class="bi bi-pencil-fill"></i>

                        </button>

                        <button
                            class="delete"
                            (click)="deleteProduct(product._id)">

                            <i class="bi bi-trash-fill"></i>

                        </button>

                    </td>

                </tr>

            </tbody>

        </table>

    </div>

    <div
        class="modal"
        *ngIf="showModal">

        <div class="modal-content">

            <h3>

                {{editing ?
                'Update Product' :
                'Add Product'}}

            </h3>

            <input
                type="text"
                placeholder="Product Name"
                [(ngModel)]="newProduct.name">

            <input
                type="text"
                placeholder="Category"
                [(ngModel)]="newProduct.category">

            <input
                type="number"
                placeholder="Price"
                [(ngModel)]="newProduct.price">

            <input
                type="number"
                placeholder="Stock"
                [(ngModel)]="newProduct.stock">

            <textarea
                placeholder="Description"
                [(ngModel)]="newProduct.description">
            </textarea>

            <div class="modal-buttons">

                <button
                    class="cancel-btn"
                    (click)="showModal=false">

                    Cancel

                </button>

                <button
                    class="save-btn"
                    (click)="addProduct()">

                    {{editing ? 'Update' : 'Save'}}

                </button>

            </div>

        </div>

    </div>

</div>
