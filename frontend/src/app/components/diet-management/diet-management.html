<div class="diet-page">

  <div class="page-header">

    <div>
      <h1>Diet Management</h1>
      <p>Manage member diet plans and nutrition.</p>
    </div>

    <button
      class="add-btn"
      (click)="openAddModal()">

      <i class="bi bi-plus-lg"></i>
      Add Diet

    </button>

  </div>


  <!-- TABLE -->

  <div class="table-card">

    <table>

      <thead>

        <tr>

          <th>Member</th>

          <th>Day</th>

          <th>Meal</th>

          <th>Food</th>

          <th>Calories</th>

          <th>Protein</th>

          <th>Actions</th>

        </tr>

      </thead>


      <tbody>

        <tr *ngFor="let diet of diets">

          <td>
            {{ diet.member?.name || '-' }}
          </td>

          <td>
            {{ diet.day }}
          </td>

          <td>

            <span class="meal-badge">
              {{ diet.mealType }}
            </span>

          </td>

          <td>
            {{ diet.foodItems }}
          </td>

          <td>
            {{ diet.calories }} kcal
          </td>

          <td>
            {{ diet.protein }} g
          </td>

          <td>

            <button
              class="edit-btn"
              (click)="editDiet(diet)">

              <i class="bi bi-pencil"></i>

            </button>


            <button
              class="delete-btn"
              (click)="deleteDiet(diet._id)">

              <i class="bi bi-trash"></i>

            </button>

          </td>

        </tr>


        <tr *ngIf="diets.length === 0">

          <td
            colspan="7"
            class="empty">

            No diet plans found.

          </td>

        </tr>

      </tbody>

    </table>

  </div>


  <!-- MODAL -->

  <div
    class="modal-backdrop"
    *ngIf="showModal">

    <div class="modal-box">

      <div class="modal-header">

        <h2>
          {{ editing ? 'Edit Diet' : 'Add Diet' }}
        </h2>

        <button
          class="close-btn"
          (click)="closeModal()">

          ×

        </button>

      </div>


      <div class="form-grid">


        <!-- MEMBER -->

        <div class="form-group">

          <label>Member *</label>

          <select
            [(ngModel)]="dietForm.member">

            <option value="">
              Select Member
            </option>

            <option
              *ngFor="let member of members"
              [value]="member._id">

              {{ member.name }}

            </option>

          </select>

        </div>


        <!-- DAY -->

        <div class="form-group">

          <label>Day *</label>

          <select
            [(ngModel)]="dietForm.day">

            <option>Monday</option>
            <option>Tuesday</option>
            <option>Wednesday</option>
            <option>Thursday</option>
            <option>Friday</option>
            <option>Saturday</option>
            <option>Sunday</option>

          </select>

        </div>


        <!-- MEAL -->

        <div class="form-group">

          <label>Meal Type *</label>

          <select
            [(ngModel)]="dietForm.mealType">

            <option>Breakfast</option>
            <option>Lunch</option>
            <option>Dinner</option>
            <option>Snack</option>

          </select>

        </div>


        <!-- FOOD -->

        <div class="form-group full">

          <label>Food Items *</label>

          <input
            type="text"
            [(ngModel)]="dietForm.foodItems"
            placeholder="Oats, Eggs, Banana">

        </div>


        <!-- CALORIES -->

        <div class="form-group">

          <label>Calories</label>

          <input
            type="number"
            [(ngModel)]="dietForm.calories">

        </div>


        <!-- PROTEIN -->

        <div class="form-group">

          <label>Protein (g)</label>

          <input
            type="number"
            [(ngModel)]="dietForm.protein">

        </div>


        <!-- CARBS -->

        <div class="form-group">

          <label>Carbs (g)</label>

          <input
            type="number"
            [(ngModel)]="dietForm.carbs">

        </div>


        <!-- FATS -->

        <div class="form-group">

          <label>Fats (g)</label>

          <input
            type="number"
            [(ngModel)]="dietForm.fats">

        </div>


        <!-- NOTES -->

        <div class="form-group full">

          <label>Notes</label>

          <textarea
            [(ngModel)]="dietForm.notes"
            placeholder="Diet instructions...">
          </textarea>

        </div>

      </div>


      <div class="modal-actions">

        <button
          class="cancel-btn"
          (click)="closeModal()">

          Cancel

        </button>

        <button
          class="save-btn"
          (click)="saveDiet()"
          [disabled]="loading">

          {{ editing ? 'Update Diet' : 'Create Diet' }}

        </button>

      </div>

    </div>

  </div>

</div>
