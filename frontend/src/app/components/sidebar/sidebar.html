<div class="sidebar">

    <div class="logo">
        <h2>🏋️ GYM PRO</h2>
        <p>Management System</p>
    </div>

    <ul class="menu">

        <li routerLink="/admin" routerLinkActive="active" [routerLinkActiveOptions]="{exact:true}">
            <i class="bi bi-grid-fill"></i>
            <span>Dashboard</span>
        </li>

        <li routerLink="/members" routerLinkActive="active">
            <i class="bi bi-people-fill"></i>
            <span>Members</span>
        </li>

        <li routerLink="/trainers" routerLinkActive="active">

            <i class="bi bi-person-badge-fill"></i>

            <span>Trainers</span>

        </li>

        <li routerLink="/workout" routerLinkActive="active">

            <i class="bi bi-heart-pulse-fill"></i>

            <span>Workout</span>

        </li>

        <li routerLink="/diet" routerLinkActive="active">

            <i class="bi bi-egg-fried"></i>

            <span>Diet Plans</span>

        </li>

        <li routerLink="/membership" routerLinkActive="active">
            <i class="bi bi-credit-card-fill"></i>
            <span>Membership</span>
        </li>

        <li routerLink="/attendance" routerLinkActive="active">
            <i class="bi bi-calendar-check-fill"></i>
            <span>Attendance</span>
        </li>

        <li routerLink="/products" routerLinkActive="active">
            <i class="bi bi-box-seam-fill"></i>
            <span>Products</span>
        </li>

        <li routerLink="/reports" routerLinkActive="active">
            <i class="bi bi-bar-chart-fill"></i>
            <span>Reports</span>
        </li>

        <li routerLink="/notifications" routerLinkActive="active">

            <i class="bi bi-bell-fill"></i>

            <span>Notifications</span>

        </li>

        <li routerLink="/settings" routerLinkActive="active">
            <i class="bi bi-gear-fill"></i>
            <span>Settings</span>
        </li>

    </ul>

    <div class="logout" (click)="logout()">

        <i class="bi bi-box-arrow-right"></i>

        <span>Logout</span>

    </div>

</div>
