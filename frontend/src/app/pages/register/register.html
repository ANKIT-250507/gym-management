
<div class="login-container">
  <div class="login-card">

    <h2>Create Account</h2>

    <div class="mb-3">
      <label>Name</label>
      <input
        type="text"
        class="form-control"
        [(ngModel)]="name"
        name="name"
        required
      >
    </div>

    <div class="mb-3">
      <label>Email</label>
      <input
        type="email"
        class="form-control"
        [(ngModel)]="email"
        name="email"
        required
      >
    </div>

    <div class="mb-3">
      <label>Password</label>
      <input
        type="password"
        class="form-control"
        [(ngModel)]="password"
        name="password"
        required
      >
    </div>

    <button
      class="btn btn-success w-100"
      (click)="register()"
    >
      Register
    </button>

    <div class="text-center mt-3">
      <a routerLink="/">Already have an account?</a>
    </div>

  </div>
</div>
