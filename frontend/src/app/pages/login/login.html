<div class="login-container">

    <div class="login-card">

        <h2>Gym Management System</h2>
        <p>Welcome Back</p>

        <form>

            <div class="mb-3">
                <label>Email</label>
                <input type="email" class="form-control" placeholder="Enter Email" [(ngModel)]="email" name="email">
            </div>

            <div class="mb-3">
                <label>Password</label>
                <input type="password" class="form-control" placeholder="Enter Password" [(ngModel)]="password"
                    name="password">
            </div>

            <button class="btn btn-danger w-100" (click)="login()">
                Login
            </button>

        </form>

        <div class="text-center mt-3">
            Don't have an account?
            <a routerLink="/register">Register</a>
        </div>

    </div>

</div>
